<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title>Skystones</title>
</head>

<body>
    <header>
        <h1 id="main-text" onclick="matchStart()">Click to start game</h1>
        <div id="score-bar" class="bar">
            <p id="score-text">Score: <span id="score-player">0</span> - <span id="score-enemy">0</span></p>
        </div>
        <div id="win-bar" class="bar">
            <p id="win-text">Wins: <span id="win-player">0</span></p>
        </div>
        <div id="difficulty-bar" class="bar">
            <p id="difficulty-text">Difficulty 0</p>
        </div>
        <span class="material-icons" id="difficulty-upp" onclick="difficultyIncrease()">arrow_upward</span>
        <span class="material-icons" id="difficulty-down" onclick="difficultyDecrease()">arrow_downward</span>

    </header>
    <div id="enemy-hand" class="hand-container"><!--
        <div class="hand-box">
        </div>-->
    </div>
    <div id="game-field"> <!--
        <div class="field-box" onclick="selectBox('index')">
            <p class="name"></p>
            <p class="top"></p>
            <p class="bottom"></p>
            <p class="left"></p>
            <p class="right"></p>
        </div>-->
    </div>
    <div id="player-hand" class="hand-container"><!--
        <div class="hand-box" onclick="selectCard('index')">
            <p class="name"></p>
            <p class="top"></p>
            <p class="bottom"></p>
            <p class="left"></p>
            <p class="right"></p>
        </div> -->
    </div>
    <script src="cards.js"></script>
    <script src="game.js"></script>
</body>

</html>
